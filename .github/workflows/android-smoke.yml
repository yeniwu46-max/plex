name: Test published PLEX APK

on:
  push:
    branches:
      - codex/plex-android-release
    paths:
      - .github/workflows/android-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify published APK
        run: |
          curl --fail --location --retry 3 --output PLEX-1.0.0.apk https://github.com/yeniwu46-max/plex/releases/download/v1.0.0/PLEX-1.0.0.apk
          curl --fail --location --retry 3 --output SHA256SUMS https://github.com/yeniwu46-max/plex/releases/download/v1.0.0/SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install PLEX-1.0.0.apk
            adb shell am start -W -n com.yeniwu46.plex/.MainActivity
            sleep 12
            adb shell pidof com.yeniwu46.plex
            adb exec-out screencap -p > plex-launch.png
            adb shell uiautomator dump /sdcard/plex-window.xml
            adb pull /sdcard/plex-window.xml plex-window.xml
      - name: Save launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plex-emulator-launch
          path: |
            plex-launch.png
            plex-window.xml
          if-no-files-found: warn
