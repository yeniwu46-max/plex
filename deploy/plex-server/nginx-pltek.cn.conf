server {
    listen 80 default_server;
    server_name pltek.cn www.pltek.cn 106.15.77.40;

    client_max_body_size 50m;
    root /opt/plex-a3/frontend-dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/letsencrypt;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The domain is pending ICP filing. Android clients use the trusted IP
# certificate already renewed by link-demo-cert-renew.timer on this host.
server {
    listen 443 ssl default_server;
    server_name 106.15.77.40;

    ssl_certificate /etc/letsencrypt-link/live/106.15.77.40/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-link/live/106.15.77.40/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    root /opt/plex-a3/frontend-dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
