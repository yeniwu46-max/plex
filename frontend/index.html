<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PLEX Universe — 登录</title>
  </head>
  <body>
    <script>
      // 防闪烁：Vue 挂载前提前写入主题 class/属性
      ;(function () {
        var stored = localStorage.getItem('plex-color-mode') || 'dark'
        var resolved = stored
        if (stored === 'auto') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (resolved !== 'light') resolved = 'dark'
        var el = document.documentElement
        el.setAttribute('data-theme', resolved)
        el.setAttribute('data-plex-theme', resolved)
        if (resolved === 'dark') el.classList.add('dark')
        else el.classList.remove('dark')
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
